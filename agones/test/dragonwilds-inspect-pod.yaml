apiVersion: v1
kind: Pod
metadata:
  name: dragonwilds-inspect
  namespace: gameservers
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: alpine:3.20
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dragonwilds-data
